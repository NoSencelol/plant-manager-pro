<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1712"><meta name="description" content="Sortenarchiv, Messwerte, Nährstoffprofile und Sorten-Meisterschaft.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Plant Manager PRO</title>
<style>
:root{color-scheme:dark;--bg:#08120f;--panel:#101e18;--line:#263b30;--text:#eef8f0;--muted:#a1b4a7;--green:#36d879;--green2:#167b45;--gold:#ffc85c;--red:#ff8989}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#14251c;color:var(--text);cursor:pointer}button.primary{background:var(--green2);border-color:var(--green2);font-weight:700}button:active{transform:scale(.99)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0b1711;color:var(--text)}textarea{min-height:85px}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.app{max-width:1200px;margin:auto;padding:14px;padding-bottom:40px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:15px}.brand{display:flex;gap:10px;align-items:center}.logo{font-size:32px;color:var(--green)}h1{font-size:22px;margin:0}h2{font-size:21px;margin:0 0 8px}h3{font-size:16px;margin:0 0 12px}.muted{color:var(--muted);font-size:12px}.nav{display:flex;gap:6px;overflow:auto;padding-bottom:10px;margin-bottom:10px}.nav button{white-space:nowrap}.nav button.active{border-color:var(--green);color:var(--green);background:#123020}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px;min-width:0}.strain{display:flex;gap:9px;align-items:center;text-align:left;width:100%;margin-top:7px;padding:8px}.strain.selected{border-color:var(--green);background:#133020}.thumb{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;background:#193a28;font-size:28px;overflow:hidden;flex-shrink:0}.thumb img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.bar{height:8px;border-radius:20px;background:#26382e;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#24ad5c,#78f0a0);border-radius:20px}.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.plant{font-size:76px;line-height:1;filter:drop-shadow(0 3px 10px #29a85a50)}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 8px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border:1px solid var(--line);border-radius:11px;padding:10px}.stat strong{display:block;font-size:21px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;text-align:center}.stage{padding:9px 2px;border:1px solid var(--line);border-radius:10px;opacity:.55}.stage.reached{opacity:1;border-color:var(--green);background:#123020}.stage span{display:block;font-size:27px}.stage b{font-size:11px}.notice{padding:10px;border-radius:10px;background:#123020;font-size:12px}.hidden{display:none!important}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line)}canvas{width:100%;height:220px}.danger{color:var(--red)}.file-label{display:inline-block;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:#14251c;cursor:pointer}.photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px}.foot{margin-top:12px;color:var(--muted);font-size:11px}
@media(max-width:720px){.app{padding:10px}.layout{grid-template-columns:1fr}.strain-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.strain{margin:0;padding:6px}.thumb{width:38px;height:38px}.hero .plant{font-size:53px}.panel{padding:11px}.grid2{grid-template-columns:1fr}.stages{grid-template-columns:repeat(5,minmax(0,1fr))}.stage span{font-size:23px}.stage b{font-size:10px}.fields{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">🌿</div><div><h1>Plant Manager <span style="color:var(--green)">PRO</span></h1><div class="muted">Sorten · Nährstoffe · Messwerte · Fortschritt</div></div></div><span class="pill">Offline-fähig</span></header>
<nav class="nav" id="nav"></nav>
<div class="toolbar"><button class="primary" id="newStrain">＋ Neue Sorte</button><button id="export">↓ Backup</button><label class="file-label">↑ Import<input id="importFile" type="file" accept=".json,application/json" hidden></label></div>
<div class="layout"><aside class="panel"><h3>🌱 Sortenarchiv</h3><input id="search" placeholder="Sorte suchen …"><div id="strainList" class="strain-list"></div><p class="muted">Jede Sorte hat eigene XP und Level.</p></aside><main id="main"></main></div>
<div class="foot">Deine Daten werden auf diesem Gerät gespeichert. Erstelle regelmäßig ein Backup, besonders vor Browserwechsel oder Gerätewechsel.</div>
</div>
<script>
(()=>{'use strict';
const KEY='plant-manager-pro-pwa-v1', $=id=>document.getElementById(id);
const tabs=[['overview','Übersicht'],['profile','Profil & Grows'],['nutrients','Nährstoffe'],['mixer','Mischrechner'],['measure','Messwerte'],['graphs','Graphen'],['level','Level & Erfolge'],['backup','Datensicherung']];
const limits=[0,100,250,500,1000,1500,2200,3000,4000,5000],names=['Anfänger','Lernender','Grundlagen','Entdecker','Fortgeschritten','Experte','Spezialist','Profi','Elite','Sortenmeister'];
let d={strains:[],tab:'overview',selected:null};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36), today=()=>new Date().toISOString().slice(0,10);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify({strains:d.strains}))}catch(e){alert('Speicher voll. Bitte Bilder verkleinern oder Backup erstellen.')}}
function sget(){return d.strains.find(s=>s.id===d.selected)||d.strains[0]}
function lvl(s){let n=1;limits.forEach((x,i)=>{if((s.xp||0)>=x)n=i+1});return Math.min(10,n)}
function prog(s){let l=lvl(s);return l===10?100:Math.max(0,Math.min(100,((s.xp-limits[l-1])/(limits[l]-limits[l-1]))*100))}
function done(s){return (s.grows||[]).filter(g=>g.done).length}
function maxReady(s){let m=s.milestones||{};return done(s)>=3&&m.phases&&m.compare&&m.notes}
function award(s,n,reason){s.xp=Math.min(5000,(s.xp||0)+n);s.log=s.log||[];s.log.unshift({date:today(),n,reason});save()}
function plant(s){return s.photo?`<img src="${s.photo}" alt="" style="width:100%;height:100%;object-fit:cover">`:['🌰','🌱','🌿','🪴','🌳','🌲'][Math.min(5,Math.floor((lvl(s)-1)/2))]}
function head(s){return `<section class="panel hero"><div><div class="row"><h2>${esc(s.name)}</h2><span class="pill">Level ${lvl(s)} · ${names[lvl(s)-1]}</span></div><p class="muted">${done(s)} abgeschlossene Grows · ${s.xp||0} XP</p><div class="bar"><span style="width:${prog(s)}%"></span></div><p class="muted">${lvl(s)===10?'Meisterschaft erreicht':`${Math.max(0,limits[lvl(s)]-(s.xp||0))} XP bis Level ${lvl(s)+1}`}</p></div><div class="plant">${plant(s)}</div></section>`}
function gates(s){let m=s.milestones||{};return `<div class="item">${done(s)>=3?'✅':'⬜'} Mindestens 3 abgeschlossene Grows (${done(s)}/3)</div><div class="item">${m.phases?'✅':'⬜'} Wachstumsphasen dokumentiert</div><div class="item">${m.compare?'✅':'⬜'} Ergebnisse verschiedener Grows verglichen</div><div class="item">${m.notes?'✅':'⬜'} Sorten-Erkenntnisse festgehalten</div>`}
function render(){ $('nav').innerHTML=tabs.map(([id,t])=>`<button data-tab="${id}" class="${d.tab===id?'active':''}">${t}</button>`).join('');$('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{d.tab=b.dataset.tab;render()});
let q=$('search').value.toLowerCase();$('strainList').innerHTML=d.strains.filter(s=>s.name.toLowerCase().includes(q)).map(s=>`<button class="strain ${s.id===d.selected?'selected':''}" data-id="${s.id}"><span class="thumb">${plant(s)}</span><span class="grow"><b>${esc(s.name)}</b><br><span class="muted">Level ${lvl(s)} · ${s.xp||0} XP</span><div class="bar" style="margin-top:5px"><span style="width:${prog(s)}%"></span></div></span></button>`).join('')||'<p class="muted">Noch keine Sorten angelegt.</p>';$('strainList').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{d.selected=b.dataset.id;render()});
let s=sget();if(!s){$('main').innerHTML='<section class="panel"><h2>Willkommen!</h2><p>Lege deine erste Sorte an, um loszulegen.</p><button class="primary" id="first">＋ Erste Sorte</button></section>';$('first').onclick=add;return}
const pages={overview:()=>overview(s),profile:()=>profile(s),nutrients:()=>nutrients(s),mixer:()=>mixer(s),measure:()=>measure(s),graphs:()=>graphs(s),level:()=>level(s),backup:()=>backup()};
$('main').innerHTML=pages[d.tab]();wire(s);if(d.tab==='graphs')draw(s)}
function overview(s){return `${head(s)}<div class="stats"><div class="stat"><span class="muted">Level</span><strong>${lvl(s)}/10</strong></div><div class="stat"><span class="muted">Grows beendet</span><strong>${done(s)}</strong></div><div class="stat"><span class="muted">XP</span><strong>${s.xp||0}</strong></div></div><section class="panel"><h3>Wachstums-Meilensteine</h3><div class="stages">${[['🌰','Keimling'],['🌱','Start'],['🌿','Routine'],['🪴','Erfahren'],['🌳','Meister']].map((x,i)=>`<div class="stage ${lvl(s)>=i*2+1?'reached':''}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><p class="muted">Symbolische Darstellung des Level-Fortschritts. Für eine individuelle Darstellung kannst du ein Sortenfoto hochladen.</p></section><div class="grid2"><section class="panel"><h3>Letzte Messwerte</h3>${(s.measurements||[]).slice(-5).reverse().map(m=>`<div class="item"><b>${esc(m.metric)}: ${esc(m.value)}</b><div class="muted">${esc(m.date)}</div></div>`).join('')||'<p class="muted">Noch keine Werte erfasst.</p>'}</section><section class="panel"><h3>Meisterschaft</h3>${gates(s)}<button class="primary" data-go="level">Level & Erfolge öffnen</button></section></div><section class="panel"><h3>Notizen</h3><textarea id="notes">${esc(s.notes)}</textarea><button class="primary" id="saveNotes" style="margin-top:8px">Notizen speichern</button></section>`}
function profile(s){return `${head(s)}<section class="panel"><h3>Sortenprofil</h3><div class="fields"><div><label>Sortenname</label><input id="name" value="${esc(s.name)}"></div><div><label>Foto der Sorte</label><input id="photo" type="file" accept="image/*"></div></div><div style="margin-top:10px"><label>Genetik / Notizen</label><textarea id="profileNotes">${esc(s.notes)}</textarea></div><button class="primary" id="saveProfile" style="margin-top:8px">Profil speichern</button><button id="delete" style="margin-top:8px">Sorte löschen</button></section><section class="panel"><h3>Grow-Historie</h3><div class="fields"><div><label>Bezeichnung</label><input id="growName" placeholder="z. B. Durchgang 1"></div><div><label>Startdatum</label><input id="growDate" type="date" value="${today()}"></div></div><button class="primary" id="addGrow" style="margin-top:8px">＋ Grow anlegen</button>${(s.grows||[]).map(g=>`<div class="item"><div class="row"><b class="grow">${esc(g.name)}</b><span class="pill">${g.done?'Abgeschlossen':'In Bearbeitung'}</span></div><span class="muted">${esc(g.date)}</span>${!g.done?`<br><button data-finish="${g.id}" style="margin-top:6px">Als abgeschlossen markieren (+200 XP)</button>`:''}</div>`).join('')}</section>`}
function nutrients(s){return `${head(s)}<section class="panel"><h3>Nährstoffprofil</h3><div class="fields"><div><label>Produkt</label><input id="nutName" placeholder="Produktname"></div><div><label>Dosis pro Liter (ml)</label><input id="nutDose" type="number" min="0" step=".1" placeholder="2"></div></div><button class="primary" id="addNut" style="margin-top:8px">Produkt hinzufügen</button>${(s.nutrients||[]).map((n,i)=>`<div class="item row"><span class="grow"><b>${esc(n.name)}</b><div class="muted">${n.dose} ml/L</div></span><button data-del-nut="${i}">Entfernen</button></div>`).join('')||'<p class="muted">Noch keine Produkte.</p>'}</section>`}
function mixer(s){return `${head(s)}<section class="panel"><h3>🧪 Mischrechner</h3><div class="fields"><div><label>Wassermenge in Litern</label><input id="liters" type="number" min="0" step=".1" value="10"></div><div><label>Einheit</label><select id="unit"><option value="ml">ml</option><option value="l">Liter</option></select></div></div><div id="mixOut" style="margin-top:10px"></div><p class="muted">Rechnet mit den im Profil hinterlegten Dosierungen. Herstellerangaben beachten.</p></section>`}
function measure(s){return `${head(s)}<section class="panel"><h3>Messwert hinzufügen</h3><div class="fields"><div><label>Messgröße</label><select id="metric"><option>EC</option><option>pH</option><option>Temperatur</option><option>Luftfeuchtigkeit</option><option>Gießmenge</option><option>Ertrag</option><option>Sonstiges</option></select></div><div><label>Wert</label><input id="value" type="number" step="any"></div><div><label>Datum</label><input id="date" type="date" value="${today()}"></div><div><label>Notiz</label><input id="note" placeholder="Optional"></div></div><button class="primary" id="addMeasure" style="margin-top:8px">Messwert speichern (+5 XP)</button></section><section class="panel"><h3>Messhistorie</h3>${(s.measurements||[]).slice().reverse().map(m=>`<div class="item"><b>${esc(m.metric)}: ${esc(m.value)}</b><span class="muted"> · ${esc(m.date)}</span><div class="muted">${esc(m.note||'')}</div></div>`).join('')||'<p class="muted">Noch keine Messwerte.</p>'}</section>`}
function level(s){return `${head(s)}<section class="panel"><div class="row"><h3 class="grow">Sorten-Meisterschaft</h3><b>${s.xp||0} / 5.000 XP</b></div><div class="bar"><span style="width:${(s.xp||0)/50}%"></span></div><p class="muted">${lvl(s)===10?'Maximales Level erreicht.':`${Math.max(0,limits[lvl(s)]-(s.xp||0))} XP bis Level ${lvl(s)+1}`}</p><div class="stages">${Array.from({length:10},(_,i)=>`<div class="stage ${lvl(s)>=i+1?'reached':''}"><span>${['🌰','🌱','🌱','🌿','🌿','🪴','🪴','🌳','🌳','🌲'][i]}</span><b>Level ${i+1}</b><div class="muted">${limits[i]} XP</div></div>`).join('')}</div></section><div class="grid2"><section class="panel"><h3>Meisterschafts-Voraussetzungen</h3>${gates(s)}<div class="notice" style="margin-top:10px">Level 10 setzt mindestens drei abgeschlossene Grows und alle drei Dokumentations-Meilensteine voraus. Das Levelsystem ist bewusst anspruchsvoll.</div><p><label><input id="phases" type="checkbox" ${s.milestones?.phases?'checked':''} style="width:auto"> Wachstumsphasen vollständig dokumentiert</label><label><input id="compare" type="checkbox" ${s.milestones?.compare?'checked':''} style="width:auto"> Ergebnisse verglichen</label><label><input id="milNotes" type="checkbox" ${s.milestones?.notes?'checked':''} style="width:auto"> Sorten-Erkenntnisse festgehalten</label></p><button class="primary" id="saveMilestones">Meilensteine speichern</button></section><section class="panel"><h3>XP-Historie</h3>${(s.log||[]).slice(0,12).map(l=>`<div class="item"><b>+${l.n} XP</b> — ${esc(l.reason)}<div class="muted">${esc(l.date)}</div></div>`).join('')||'<p class="muted">Noch keine XP gesammelt.</p>'}</section></div>`}
function graphs(s){return `<section class="panel">${head(s)}<h3>Messwerte im Verlauf</h3><label>Messgröße</label><select id="graphMetric"><option>EC</option><option>pH</option><option>Temperatur</option><option>Luftfeuchtigkeit</option></select><canvas id="chart" width="720" height="230"></canvas><p class="muted">Chronologischer Verlauf gespeicherter Messwerte.</p></section>`}
function backup(){return `<section class="panel"><h2>Datensicherung</h2><p>Exportiere deine Sorten, Bilder, Grow-Historie, Nährstoffprofile, XP und Messwerte als JSON-Backup.</p><button class="primary" id="exportPage">Backup herunterladen</button><div class="notice" style="margin-top:12px">Beim Import werden die bestehenden Daten ersetzt. Exportiere zuerst ein Backup. Daten sind standardmäßig nur auf diesem Gerät vorhanden.</div></section>`}
function wire(s){const on=(id,fn)=>{let e=$(id);if(e)e.onclick=fn};on('saveNotes',()=>{s.notes=$('notes').value;save();render()});on('saveProfile',()=>{s.name=$('name').value.trim()||s.name;s.notes=$('profileNotes').value;let f=$('photo').files[0];if(f){if(f.size>3*1024*1024&&!confirm('Das Bild ist größer als 3 MB. Es kann viel Speicher belegen. Trotzdem verwenden?'))return;let r=new FileReader();r.onload=()=>{s.photo=r.result;save();render()};r.readAsDataURL(f)}else{save();render()}});
on('delete',()=>{if(confirm('Sorte wirklich samt Daten löschen?')){d.strains=d.strains.filter(x=>x.id!==s.id);d.selected=d.strains[0]?.id||null;save();render()}});
on('addGrow',()=>{let n=$('growName').value.trim();if(!n)return alert('Bitte Grow benennen.');s.grows.push({id:uid(),name:n,date:$('growDate').value||today(),done:false});save();render()});
document.querySelectorAll('[data-finish]').forEach(b=>b.onclick=()=>{let g=s.grows.find(x=>x.id===b.dataset.finish);if(g&&!g.done&&confirm('Grow wirklich als abgeschlossen markieren?')){g.done=true;g.end=today();award(s,200,'Grow abgeschlossen: '+g.name);save();render()}});
on('saveMilestones',()=>{s.milestones={phases:$('phases').checked,compare:$('compare').checked,notes:$('milNotes').checked};if(maxReady(s))s.xp=5000;save();render()});
on('addNut',()=>{let n=$('nutName').value.trim(),v=Number($('nutDose').value);if(!n||!Number.isFinite(v)||v<0)return alert('Produkt und gültige Dosis eingeben.');s.nutrients.push({name:n,dose:v});award(s,5,'Nährstoffprofil ergänzt');render()});
document.querySelectorAll('[data-del-nut]').forEach(b=>b.onclick=()=>{s.nutrients.splice(+b.dataset.delNut,1);save();render()});
const calc=()=>{let l=Math.max(0,Number($('liters').value)||0),unit=$('unit').value;$('mixOut').innerHTML=(s.nutrients||[]).map(n=>`<div class="item row"><span class="grow">${esc(n.name)} <span class="muted">(${n.dose} ml/L)</span></span><b>${(n.dose*l/(unit==='l'?1000:1)).toLocaleString('de-DE',{maximumFractionDigits:2})} ${unit}</b></div>`).join('')||'<p class="muted">Lege erst Produkte im Nährstoffprofil an.</p>'};if($('liters')){$('liters').oninput=calc;$('unit').onchange=calc;calc()}
on('addMeasure',()=>{if($('value').value==='')return alert('Bitte einen Wert eingeben.');let v=Number($('value').value);if(!Number.isFinite(v))return alert('Ungültiger Wert.');s.measurements.push({metric:$('metric').value,value:v,date:$('date').value||today(),note:$('note').value});award(s,5,'Messwert gespeichert');render()});
on('exportPage',exportData);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{d.tab=b.dataset.go;render()})}
function draw(s){let c=$('chart');if(!c)return;let ctx=c.getContext('2d'),sel=$('graphMetric');function paint(){let ms=(s.measurements||[]).filter(m=>m.metric===sel.value).slice(-40),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#375044';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(42,15+i*45);ctx.lineTo(w-12,15+i*45);ctx.stroke()}if(!ms.length){ctx.fillStyle='#a1b4a7';ctx.fillText('Noch keine Messwerte für '+sel.value,55,110);return}let vs=ms.map(m=>+m.value),lo=Math.min(...vs),hi=Math.max(...vs);if(lo===hi){lo-=1;hi+=1}ctx.strokeStyle='#39d879';ctx.lineWidth=3;ctx.beginPath();ms.forEach((m,i)=>{let x=45+(ms.length===1?0:i*(w-65)/(ms.length-1)),y=195-(+m.value-lo)/(hi-lo)*165;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#a1b4a7';ctx.font='12px system-ui';ctx.fillText(String(hi),5,30);ctx.fillText(String(lo),5,195);ctx.fillText(ms[0].date,45,220);ctx.fillText(ms[ms.length-1].date,w-100,220)}sel.onchange=paint;paint()}
function add(){let n=prompt('Name der Sorte:');if(!n||!n.trim())return;let s={id:uid(),name:n.trim(),xp:0,notes:'',photo:'',nutrients:[],measurements:[],grows:[],milestones:{},log:[]};d.strains.push(s);d.selected=s.id;save();render()}
function exportData(){let blob=new Blob([JSON.stringify({version:1,strains:d.strains},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='plant-manager-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('newStrain').onclick=add;$('export').onclick=exportData;$('search').oninput=render;$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.strains))throw Error('Kein passendes Backup');if(!confirm('Vorhandene Daten ersetzen?'))return;d.strains=x.strains;d.selected=d.strains[0]?.id||null;save();render()}catch(err){alert('Import fehlgeschlagen: '+err.message)}};r.readAsText(f);e.target.value=''};
